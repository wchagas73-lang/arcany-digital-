name: Build validation

on:
  push:
    branches: [main, feat/supabase-auth-protection]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const v=a.metadata?.vulnerabilities || {}; console.log(JSON.stringify({vulnerabilities:v, advisories:Object.entries(a.vulnerabilities||{}).map(([name,item])=>({name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable}))},null,2)); if ((v.total || 0) > 0) process.exit(1)'
      - name: Validate production build
        run: npm run build
      - name: Validate lint
        run: npm run lint
